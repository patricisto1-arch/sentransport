# SenTransport - lancement de toute l'application
# Variables lues depuis le fichier .env (créé par le pipeline en déploiement,
# à créer à la main en local, voir .env.example dans le README)
#   REGISTRY, TAG, POSTGRES_PASSWORD, JWT_SECRET

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentransport
      POSTGRES_USER: sentransport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentransport -d sentransport"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  colis:
    image: ${REGISTRY}/colis:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sentransport:${POSTGRES_PASSWORD}@db:5432/sentransport
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  utilisateurs:
    image: ${REGISTRY}/utilisateurs:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sentransport:${POSTGRES_PASSWORD}@db:5432/sentransport
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  livraisons:
    image: ${REGISTRY}/livraisons:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sentransport:${POSTGRES_PASSWORD}@db:5432/sentransport
      JWT_SECRET: ${JWT_SECRET}
      COLIS_URL: http://colis:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  frontend:
    image: ${REGISTRY}/frontend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - backend

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - colis
      - utilisateurs
      - livraisons
      - frontend
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
