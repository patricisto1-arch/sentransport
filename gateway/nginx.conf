
# Passerelle SenTransport : un seul point d'entrée pour le frontend et les API.
# Chaque service écoute sur le port 8000 dans son conteneur.

server {
    listen 80;
    server_name _;

    # Résolution DNS dynamique de Docker
    resolver 127.0.0.11 valid=10s;

    # --- API Colis ---
    location /api/colis/ {
        set $upstream http://colis:8000;
        rewrite ^/api/colis/(.*)$ /$1 break;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- API Utilisateurs ---
    location /api/utilisateurs/ {
        set $upstream http://utilisateurs:8000;
        rewrite ^/api/utilisateurs/(.*)$ /$1 break;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- API Livraisons ---
    location /api/livraisons/ {
        set $upstream http://livraisons:8000;
        rewrite ^/api/livraisons/(.*)$ /$1 break;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- Frontend ---
    location / {
        set $upstream http://frontend:80;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
