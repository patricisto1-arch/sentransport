# =============================================================
# SenTransport - CI/CD avec GitHub Actions
# test -> quality -> security -> package (GHCR) -> deploy
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   POSTGRES_PASSWORD, JWT_SECRET, SSH_PRIVATE_KEY
# Secret par environnement (Settings > Environments) :
#   DEPLOY_HOST  (un dans "staging", un dans "production")
# =============================================================

name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------
  # TEST : tests unitaires + couverture minimale de 60 %
  # ---------------------------------------------------------
  test-service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [colis, utilisateurs, livraisons]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Lancer les tests
        run: pytest --cov=. --cov-report=term --cov-report=xml --cov-fail-under=60
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build

  # ---------------------------------------------------------
  # QUALITY : style et qualité du code
  # ---------------------------------------------------------
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 services --max-line-length=120 --exclude=__pycache__,venv,.venv

  # ---------------------------------------------------------
  # SECURITY : scan des dépendances, de la config et des secrets
  # (exit-code 0 : signale sans bloquer ; mettre "1" pour bloquer)
  # ---------------------------------------------------------
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ---------------------------------------------------------
  # PACKAGE : images Docker publiées dans GitHub Container Registry
  # ---------------------------------------------------------
  package:
    needs: [test-service, test-frontend, lint-python, trivy-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [colis, utilisateurs, livraisons, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Nom du dépôt en minuscules (exigé par GHCR)
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dossier de build
        id: ctx
        run: |
          if [ "${{ matrix.image }}" = "frontend" ]; then
            echo "path=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "path=services/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.REPO }}/${{ matrix.image }}:latest

  # ---------------------------------------------------------
  # DEPLOY : develop -> staging (auto) ; main -> production
  # (validation manuelle : activer "Required reviewers" dans
  #  Settings > Environments > production)
  # ---------------------------------------------------------
  deploy:
    needs: package
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Nom du dépôt en minuscules
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Préparer SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Déployer avec docker compose
        run: |
          ssh deploy@$DEPLOY_HOST "mkdir -p ~/sentransport"
          scp -r docker-compose.yml gateway database deploy@$DEPLOY_HOST:~/sentransport/
          ssh deploy@$DEPLOY_HOST "cat > ~/sentransport/.env" <<EOF
          REGISTRY=ghcr.io/$REPO
          TAG=$GITHUB_SHA
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          EOF
          echo "$GHCR_TOKEN" | ssh deploy@$DEPLOY_HOST "docker login ghcr.io -u $GH_ACTOR --password-stdin"
          ssh deploy@$DEPLOY_HOST "cd ~/sentransport && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f"
