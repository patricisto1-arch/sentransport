# =============================================================
# SenTransport - Pipeline GitLab CI/CD
# Stages : test -> quality -> security -> package -> deploy
# =============================================================

stages:
  - test
  - quality
  - security
  - package
  - deploy

# Analyses de sécurité fournies par GitLab (tournent dans le stage "test")
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

default:
  interruptible: true

# -------------------------------------------------------------
# TEST : tests unitaires + couverture minimale de 60 %
# -------------------------------------------------------------
test-service:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$SERVICE
    paths:
      - .cache/pip
  parallel:
    matrix:
      - SERVICE: [colis, utilisateurs, livraisons]
  script:
    - cd services/$SERVICE
    - pip install -r requirements.txt pytest pytest-cov
    - pytest --cov=. --cov-report=term --cov-report=xml --cov-fail-under=60
  coverage: '/TOTAL.*\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/$SERVICE/coverage.xml

test-frontend:
  stage: test
  image: node:20-alpine
  cache:
    key: npm-frontend
    paths:
      - .cache/npm
  script:
    - cd frontend
    - npm ci
    - CI=true npm test -- --watchAll=false
    - npm run build

# -------------------------------------------------------------
# QUALITY : style et qualité du code
# -------------------------------------------------------------
lint-python:
  stage: quality
  image: python:3.12-slim
  script:
    - pip install flake8
    - flake8 services --max-line-length=120 --exclude=__pycache__,venv,.venv

# -------------------------------------------------------------
# SECURITY : scan des dépendances et de la configuration
# (exit-code 0 : le job signale les failles sans bloquer ;
#  passer à 1 pour rendre le scan bloquant)
# -------------------------------------------------------------
trivy-scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --scanners vuln,misconfig,secret .

# -------------------------------------------------------------
# PACKAGE : construction et publication des images Docker
# dans le Container Registry de GitLab
# -------------------------------------------------------------
build-images:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  parallel:
    matrix:
      - IMAGE: [colis, utilisateurs, livraisons, frontend]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ "$IMAGE" = "frontend" ]; then CTX=frontend; else CTX=services/$IMAGE; fi
      docker build \
        -t "$CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/$IMAGE:latest" \
        "$CTX"
      docker push "$CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$CI_REGISTRY_IMAGE/$IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"

# -------------------------------------------------------------
# DEPLOY : déploiement par SSH avec docker compose
# develop -> staging (automatique) ; main -> production (manuel)
#
# Variables CI/CD à définir (Settings > CI/CD > Variables) :
#   SSH_PRIVATE_KEY, STAGING_HOST, PROD_HOST,
#   POSTGRES_PASSWORD, JWT_SECRET
# Le serveur doit avoir Docker + le plugin compose, et un
# utilisateur "deploy" autorisé à lancer docker.
# -------------------------------------------------------------
.deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh deploy@$DEPLOY_HOST "mkdir -p ~/sentransport"
    - scp -r docker-compose.yml gateway database deploy@$DEPLOY_HOST:~/sentransport/
    - |
      ssh deploy@$DEPLOY_HOST "cat > ~/sentransport/.env <<EOF
      REGISTRY=$CI_REGISTRY_IMAGE
      TAG=$CI_COMMIT_SHORT_SHA
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      JWT_SECRET=$JWT_SECRET
      EOF"
    - |
      ssh deploy@$DEPLOY_HOST "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' \
        && cd ~/sentransport \
        && docker compose pull \
        && docker compose up -d --remove-orphans \
        && docker image prune -f"

deploy-staging:
  extends: .deploy
  variables:
    DEPLOY_HOST: $STAGING_HOST
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy-production:
  extends: .deploy
  variables:
    DEPLOY_HOST: $PROD_HOST
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
